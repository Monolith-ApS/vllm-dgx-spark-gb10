# docker compose alternative to scripts/run.sh
#
#   docker compose up -d                                   # 512k-c3, thinking off
#   PROFILE=512k-c3-think docker compose up -d             # same, thinking on by default
#   PROFILE=128k-c8 docker compose up -d
#   docker compose logs -f
#
# Build the image first: scripts/build.sh qwen3.8-flash-next
services:
  qwen38-flash-next:
    image: ${IMAGE:-vllm-dgx-spark-gb10:qwen3.8-flash-next}
    container_name: ${NAME:-qwen38-flash-next}
    restart: unless-stopped
    ipc: host
    shm_size: 16g
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PROFILE: ${PROFILE:-512k-c3}
      THINKING: ${THINKING:-0}
      API_KEY: ${API_KEY:-}
    volumes:
      - ${DATA_DIR:-/data}/models/Qwen3.8-Flash-Next-NVFP4:/models/Qwen3.8-Flash-Next-NVFP4:ro
      - ${DATA_DIR:-/data}/cache/vllm:/root/.cache/vllm
      - ${DATA_DIR:-/data}/cache/flashinfer:/root/.cache/flashinfer
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
