# docker compose alternative to scripts/run.sh. The model's settings come from its model.env:
#
#   docker compose --env-file models/qwen3.8-flash-next/model.env up -d                  # default profile and vLLM release
#   VLLM=0.32 PROFILE=512k-c3-think docker compose --env-file models/qwen3.8-flash-next/model.env up -d
#   docker compose logs -f
#
# Build the image first with the same VLLM: scripts/build.sh qwen3.8-flash-next (or VLLM=0.32 scripts/build.sh ...).
# The cache directories must exist (mkdir -p /data/cache/<model>-vllm<release>/{vllm,flashinfer,humming}); scripts/run.sh
# creates them.
services:
  model:
    image: ${IMAGE:-vllm-dgx-spark-gb10:${MODEL_NAME}-vllm${VLLM:-${VLLM_DEFAULT}}}
    container_name: ${NAME:-vllm-gb10}
    restart: unless-stopped
    ipc: host
    shm_size: 16g
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PROFILE: ${PROFILE:-${DEFAULT_PROFILE}}
      THINKING: ${THINKING:-0}
      SERVED_NAME: ${SERVED_NAME}
      MODEL: /models/${WEIGHTS_DIR}
      API_KEY: ${API_KEY:-}
    volumes:
      - ${DATA_DIR:-/data}/models/${WEIGHTS_DIR}:/models/${WEIGHTS_DIR}:ro
      - ${DATA_DIR:-/data}/cache/${MODEL_NAME}-vllm${VLLM:-${VLLM_DEFAULT}}/vllm:/root/.cache/vllm
      - ${DATA_DIR:-/data}/cache/${MODEL_NAME}-vllm${VLLM:-${VLLM_DEFAULT}}/flashinfer:/root/.cache/flashinfer
      - ${DATA_DIR:-/data}/cache/${MODEL_NAME}-vllm${VLLM:-${VLLM_DEFAULT}}/humming:/root/.humming
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
